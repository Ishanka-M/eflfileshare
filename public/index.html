<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EFL File Share — Login</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1d3c78">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <h1><img src="/favicon.svg" alt="">EFL File Share</h1>
    <div class="muted small" style="margin-bottom:20px">Inbound / Outbound Excel exchange</div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button class="btn" style="width:100%" id="loginBtn">Log in</button>
    </form>
    <div class="login-hint">You'll be taken to the Upload or Download portal automatically.</div>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
  const dest = { uploader: "/upload.html", downloader: "/download.html", admin: "/admin.html" };

  // Already logged in? go straight to the portal
  api("/api/auth/me").then(me => { if (me.user) location.href = dest[me.user.type]; }).catch(() => {});

  $("#loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const btn = $("#loginBtn"); btn.disabled = true; btn.textContent = "Checking…";
    let prefer = "";
    try { prefer = localStorage.getItem("efl_fs_last_portal:" + $("#username").value.trim().toLowerCase()) || ""; } catch {}
    try {
      // the server decides: Upload, Download, Both (→ last used portal) or Admin
      const r = await api("/api/auth/login", { method: "POST", body: { username: $("#username").value, password: $("#password").value, prefer } });
      location.href = dest[r.portal];
    } catch (err) {
      toast(err.message, "error");
      btn.disabled = false; btn.textContent = "Log in";
    }
  };
</script>
</body>
</html>
