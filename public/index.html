<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EFL File Share — Login</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <h1>📦 EFL File Share</h1>
    <div class="muted small">Inbound / Outbound Excel exchange</div>

    <div class="portal-switch" id="portalSwitch">
      <button type="button" data-portal="uploader" class="active"><span class="ic">⬆️</span>Upload Portal</button>
      <button type="button" data-portal="downloader"><span class="ic">⬇️</span>Download Portal</button>
    </div>
    <div id="adminBanner" class="badge new" style="display:none;margin-bottom:12px">Admin login</div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button class="btn" style="width:100%" id="loginBtn">Log in</button>
    </form>
    <a class="admin-link" id="adminToggle">Admin login</a>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
  let portal = localStorage.getItem("efl_fs_portal") || "uploader";
  const dest = { uploader: "/upload.html", downloader: "/download.html", admin: "/admin.html" };

  function setPortal(p) {
    portal = p;
    $$("#portalSwitch button").forEach(b => b.classList.toggle("active", b.dataset.portal === p));
    $("#portalSwitch").style.display = p === "admin" ? "none" : "";
    $("#adminBanner").style.display = p === "admin" ? "inline-block" : "none";
    $("#adminToggle").textContent = p === "admin" ? "← Back to user login" : "Admin login";
    if (p === "admin") $("#username").value = "admin";
  }
  $$("#portalSwitch button").forEach(b => b.onclick = () => setPortal(b.dataset.portal));
  $("#adminToggle").onclick = () => setPortal(portal === "admin" ? "uploader" : "admin");
  setPortal(portal === "admin" ? "uploader" : portal);

  // Already logged in? go straight to the portal
  api("/api/auth/me").then(me => { if (me.user) location.href = dest[me.user.type]; }).catch(() => {});

  $("#loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const btn = $("#loginBtn"); btn.disabled = true; btn.textContent = "Checking…";
    try {
      await api("/api/auth/login", { method: "POST", body: { portal, username: $("#username").value, password: $("#password").value } });
      if (portal !== "admin") localStorage.setItem("efl_fs_portal", portal);
      location.href = dest[portal];
    } catch (err) {
      toast(err.message, "error");
      btn.disabled = false; btn.textContent = "Log in";
    }
  };
</script>
</body>
</html>
